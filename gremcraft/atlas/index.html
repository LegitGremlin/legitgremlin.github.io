<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GremCraft : Atlas</title>
  <style>
    :root {
      --bg: #14110e;
      --surface: #1c1814;
      --raised: #26201b;
      --slot: #171310;
      --border: #362e26;
      --fg: #f4ecdf;
      --muted: #a39788;
      --accent: #e0b15a;
      --accent-ink: #14110e;
      --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-display: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--fg);
      font-family: var(--font-sans);
      line-height: 1.5;
      min-height: 100vh;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    main {
      max-width: 72rem;
      margin: 0 auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    @media (min-width: 768px) {
      main {
        padding: 1.5rem;
      }
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .eyebrow {
      font-family: var(--font-display);
      color: var(--accent);
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      font-weight: 700;
    }

    h1 {
      font-family: var(--font-display);
      color: var(--fg);
      margin-top: 0.25rem;
      font-size: 1.5rem;
      line-height: 1.2;
    }

    @media (min-width: 768px) {
      h1 {
        font-size: 1.875rem;
      }
    }

    .subtitle {
      color: var(--muted);
      margin-top: 0.25rem;
      font-size: 0.875rem;
    }

    .search-label {
      width: 100%;
    }

    @media (min-width: 768px) {
      .search-label {
        width: 18rem;
      }
    }

    .search-input {
      background-color: var(--surface);
      color: var(--fg);
      border: 1px solid var(--border);
      width: 100%;
      border-radius: 0.5rem;
      padding: 0.75rem;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .search-input::placeholder {
      color: var(--muted);
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .filter-btn {
      border-radius: 9999px;
      border: 1px solid var(--border);
      background-color: var(--surface);
      color: var(--fg);
      padding: 0.5rem 1rem;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .filter-btn:hover {
      border-color: var(--accent);
    }

    .filter-btn.active {
      background-color: var(--accent);
      color: var(--accent-ink);
      border-color: var(--accent);
    }

    .workspace {
      display: grid;
      align-items: start;
      gap: 1rem;
    }

    @media (min-width: 1024px) {
      .workspace {
        grid-template-columns: minmax(0, 1fr) 22rem;
      }
    }

    .catalog-panel {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 0.75rem;
    }

    .status-msg {
      color: var(--muted);
      padding: 2rem 0.5rem;
      text-align: center;
      font-size: 0.875rem;
    }

    .tile-grid {
      list-style: none;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.5rem;
    }

    @media (min-width: 640px) {
      .tile-grid {
        grid-template-columns: repeat(6, minmax(0, 1fr));
      }
    }

    @media (min-width: 768px) {
      .tile-grid {
        grid-template-columns: repeat(8, minmax(0, 1fr));
      }
    }

    .item-btn {
      display: flex;
      aspect-ratio: 1 / 1;
      width: 100%;
      align-items: center;
      justify-content: center;
      border-radius: 0.5rem;
      border: 1px solid var(--border);
      background-color: var(--slot);
      padding: 0.25rem;
      cursor: pointer;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    .item-btn:hover {
      border-color: var(--accent);
    }

    .item-btn.active {
      border-color: var(--accent);
      background-color: var(--raised);
    }

    .recipe-panel {
      background-color: var(--surface);
      border: 1px solid var(--border);
      position: sticky;
      top: 1rem;
      border-radius: 0.75rem;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .recipe-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .preview-box {
      background-color: var(--slot);
      border: 1px solid var(--border);
      display: flex;
      width: 3.5rem;
      height: 3.5rem;
      align-items: center;
      justify-content: center;
      border-radius: 0.5rem;
      flex-shrink: 0;
    }

    .recipe-title {
      font-family: var(--font-display);
      color: var(--fg);
      font-size: 1.125rem;
      line-height: 1.3;
    }

    .recipe-meta {
      color: var(--muted);
      font-size: 0.75rem;
    }

    .recipe-empty-hint {
      color: var(--muted);
      margin-top: 0.25rem;
      font-size: 0.875rem;
    }

    .step-chain {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 0 0 12px;
      padding: 0;
    }
    .step-chip {
      font: inherit;
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid currentColor;
      background: transparent;
      color: inherit;
      opacity: 0.65;
      cursor: pointer;
    }
    .step-chip:hover:not(:disabled) { opacity: 1; }
    .step-chip.active { opacity: 1; font-weight: 700; background: rgba(255, 140, 40, 0.25); }
    .step-chip:disabled { cursor: default; opacity: 0.3; }

    .crop-section { margin: 0 0 12px; }
    .crop-label { display: block; font-size: 0.85rem; margin-bottom: 4px; }
    .crop-slider { width: 100%; }

    .variants-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.375rem;
    }

    .variants-label {
      color: var(--muted);
      font-size: 0.75rem;
      margin-right: 0.25rem;
    }

    .variant-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      background-color: var(--raised);
      border: 1px solid var(--border);
      border-radius: 0.375rem;
      padding: 0.2rem 0.4rem;
      font-size: 0.72rem;
      color: var(--fg);
    }

    .stats-section {
      border-top: 1px solid var(--border);
      padding-top: 0.75rem;
    }

    .stats-heading {
      font-family: var(--font-display);
      color: var(--muted);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 0.5rem;
    }

    .stats-list {
      list-style: none;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.375rem 0.5rem;
    }

    .stat-box {
      background-color: var(--slot);
      border: 1px solid var(--border);
      border-radius: 0.375rem;
      padding: 0.35rem 0.5rem;
      display: flex;
      flex-direction: column;
    }

    .stat-box.wide {
      grid-column: 1 / -1;
    }

    .stat-label {
      color: var(--muted);
      font-size: 0.68rem;
      line-height: 1.2;
    }

    .stat-value {
      font-family: var(--font-display);
      color: var(--fg);
      font-size: 0.8rem;
      font-weight: 600;
      margin-top: 0.1rem;
      word-break: break-word;
    }

    .crafting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .crafting-grid {
      background-color: var(--raised);
      border: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.375rem;
      border-radius: 0.5rem;
      padding: 0.5rem;
    }

    .craft-slot {
      background-color: var(--slot);
      border: 1px solid var(--border);
      position: relative;
      display: flex;
      width: 3.5rem;
      height: 3.5rem;
      align-items: center;
      justify-content: center;
      border-radius: 0.375rem;
    }

    .slot-note {
      color: var(--accent);
      position: absolute;
      right: 0.125rem;
      bottom: 0;
      font-weight: 700;
      font-size: 0.75rem;
    }

    .arrow {
      color: var(--muted);
      font-family: var(--font-display);
      font-size: 1.25rem;
      user-select: none;
    }

    .output-slot {
      background-color: var(--slot);
      border: 1px solid var(--border);
      position: relative;
      display: flex;
      width: 4rem;
      height: 4rem;
      align-items: center;
      justify-content: center;
      border-radius: 0.5rem;
    }

    .result-count {
      color: var(--fg);
      position: absolute;
      right: 0.25rem;
      bottom: 0.125rem;
      font-size: 0.875rem;
      font-weight: 700;
    }

    .caption {
      color: var(--muted);
      font-size: 0.875rem;
    }

    .ingredients-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .ingredient-item {
      color: var(--fg);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.875rem;
    }

    .ingredient-note {
      color: var(--muted);
    }

    .sprite {
      display: inline-block;
      background-image: url("./atlas.png");
      background-repeat: no-repeat;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      flex-shrink: 0;
    }

    .sprite-fallback {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--muted);
      font-family: var(--font-display);
      font-size: 0.75rem;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">GREMCRAFT</p>
        <h1>Atlas</h1>
        <p class="subtitle" id="tile-count">Loading atlas…</p>
      </div>
      <label class="search-label">
        <span class="sr-only">Search items</span>
        <input
          id="search-input"
          type="text"
          placeholder="Search blocks and items"
          class="search-input"
          autocomplete="off"
        />
      </label>
    </header>

    <div class="filters" id="filter-bar" role="group" aria-label="Filter tiles"></div>

    <div class="workspace">
      <section class="catalog-panel" id="catalog-panel">
        <p class="status-msg">Loading tiles…</p>
      </section>
      <aside class="recipe-panel" id="recipe-panel"></aside>
    </div>
  </main>

  <script>
    const FILTERS = [
      ["all", "All"],
      ["block", "Blocks"],
      ["item", "Items"],
      ["crafted", "Craftable"],
      ["steps", "Forge Steps"]
    ];

    // The four-stage Ember Alloy pipeline, in order.
    const STEP_NAMES = {
      1: "Hellish Liquefaction",
      2: "Infusion",
      3: "Quenching",
      4: "Forging"
    };

    // Quenching is a world interaction (throw the item into water), so it is not a
    // station recipe in the game's recipes.json. Used unless recipes.json has a "quench" list.
    const DEFAULT_QUENCH = [
      { input: "gremcraft:ember_compound", output: "gremcraft:chilled_ember_compound", medium: "water" }
    ];

    const EXCLUDED_TILE_PATTERNS = [/^crack_\d+$/];

    const PART_SUFFIXES = ["_foot", "_head", "_upper", "_lower"];
    const FACE_SUFFIXES = [
      "_front_lit",
      "_front",
      "_side",
      "_top",
      "_bottom",
      "_end"
    ];

    const PREFERRED_FACES = [
      "_top",
      "_front",
      "_side",
      "_end",
      "_bottom",
      "_front_lit"
    ];

    const state = {
      items: [],
      itemMap: new Map(),
      spriteMap: new Map(),
      recipes: {},
      query: "",
      filter: "all",
      selected: null
    };

    const tileCountEl = document.getElementById("tile-count");
    const searchInputEl = document.getElementById("search-input");
    const filterBarEl = document.getElementById("filter-bar");
    const catalogPanelEl = document.getElementById("catalog-panel");
    const recipePanelEl = document.getElementById("recipe-panel");

    function isExcludedTile(key) {
      return EXCLUDED_TILE_PATTERNS.some((re) => re.test(key));
    }

    function stripNamespace(id) {
      return String(id ?? "").replace(/^gremcraft:/, "");
    }

    function normalizeGroupKey(rawKey) {
      let k = stripNamespace(rawKey);

      // Crop growth stages (wheat_0 ... wheat_7) belong to one crop entry.
      const cropMatch = k.match(/^(wheat)_\d+$/);
      if (cropMatch) return cropMatch[1];

      const doorMatch = k.match(/^door_([a-z0-9_]+?)(?:_(?:lower|upper))?$/);
      if (doorMatch) {
        return `${doorMatch[1]}_door`;
      }

      for (const suffix of PART_SUFFIXES) {
        if (k.endsWith(suffix)) {
          k = k.slice(0, -suffix.length);
          break;
        }
      }

      for (const suffix of FACE_SUFFIXES) {
        if (k.endsWith(suffix)) {
          k = k.slice(0, -suffix.length);
          break;
        }
      }

      return k;
    }

    function humanizeKey(key) {
      return stripNamespace(key)
        .replace(/^item_/, "")
        .replace(/[_-]+/g, " ")
        .replace(/\b\w/g, (c) => c.toUpperCase());
    }

    function pickRepresentative(groupKeys, baseKey) {
      if (groupKeys.includes(baseKey)) return baseKey;
      for (const suffix of PREFERRED_FACES) {
        const candidate = `${baseKey}${suffix}`;
        if (groupKeys.includes(candidate)) return candidate;
      }
      return groupKeys[0];
    }

    function parseAtlas(atlasData, sheetWidth, sheetHeight) {
      const tileSize = atlasData.tile_size ?? 16;
      const cols = atlasData.columns ?? (sheetWidth && tileSize ? Math.floor(sheetWidth / tileSize) : 8);
      const rows = atlasData.rows ?? (sheetHeight && tileSize ? Math.floor(sheetHeight / tileSize) : 24);
      const totalW = sheetWidth || cols * tileSize;
      const totalH = sheetHeight || rows * tileSize;
      const tilesObj = atlasData.tiles && typeof atlasData.tiles === "object" ? atlasData.tiles : {};

      const spriteMap = new Map();
      const groups = new Map();

      for (const [rawKey, coords] of Object.entries(tilesObj)) {
        const [col, row] = Array.isArray(coords) ? coords : [0, 0];
        const spriteInfo = {
          key: rawKey,
          frame: {
            x: col * tileSize,
            y: row * tileSize,
            w: tileSize,
            h: tileSize
          },
          sheetW: totalW,
          sheetH: totalH
        };
        spriteMap.set(rawKey, spriteInfo);

        if (isExcludedTile(rawKey)) continue;

        const groupKey = rawKey.startsWith("item_") ? rawKey : normalizeGroupKey(rawKey);
        if (!groups.has(groupKey)) {
          groups.set(groupKey, []);
        }
        groups.get(groupKey).push(rawKey);
      }

      const items = [];
      for (const [groupKey, rawKeys] of groups.entries()) {
        const repKey = pickRepresentative(rawKeys, groupKey);
        const repSprite = spriteMap.get(repKey);
        const isItem = groupKey.startsWith("item_");

        if (!spriteMap.has(groupKey) && repSprite) {
          spriteMap.set(groupKey, { ...repSprite, key: groupKey });
        }

        items.push({
          key: groupKey,
          spriteKey: repKey,
          variants: rawKeys,
          name: humanizeKey(groupKey),
          kind: isItem ? "item" : "block",
          crafted: false,
          factors: {},
          frame: repSprite.frame,
          sheetW: totalW,
          sheetH: totalH
        });
      }

      return { items, spriteMap };
    }

    function resolveItemKey(rawId, itemMap, spriteMap) {
      const base = stripNamespace(rawId);
      if (itemMap.has(`item_${base}`)) return `item_${base}`;
      if (itemMap.has(base)) return base;

      const grouped = normalizeGroupKey(base);
      if (itemMap.has(grouped)) return grouped;

      if (base === "log" && itemMap.has("log")) return "log";
      if (base === "log" && itemMap.has("log_side")) return "log_side";
      if (base === "birch_log" && itemMap.has("log_birch")) return "log_birch";
      if (base === "birch_log" && itemMap.has("log_birch_side")) return "log_birch_side";
      if (base === "spruce_log" && itemMap.has("log_spruce")) return "log_spruce";
      if (base === "spruce_log" && itemMap.has("log_spruce_side")) return "log_spruce_side";
      if (base === "wool" && itemMap.has("wool_white")) return "wool_white";

      if (spriteMap.has(base)) return base;
      return grouped;
    }

    function mergeFactorsIntoItems(items, itemMap, spriteMap, blocksData, itemsData) {
      const blocks = Array.isArray(blocksData?.blocks) ? blocksData.blocks : [];
      const itemDefs = Array.isArray(itemsData?.items) ? itemsData.items : [];

      for (const def of itemDefs) {
        const baseId = stripNamespace(def.id);
        const targetKey = itemMap.has(`item_${baseId}`)
          ? `item_${baseId}`
          : itemMap.has(baseId)
            ? baseId
            : `item_${baseId}`;

        const spriteKey = def.sprite && spriteMap.has(def.sprite)
          ? def.sprite
          : spriteMap.has(targetKey)
            ? targetKey
            : null;
        const spriteInfo = spriteKey ? spriteMap.get(spriteKey) : null;

        let entry = itemMap.get(targetKey);
        if (!entry) {
          entry = {
            key: targetKey,
            spriteKey: spriteKey ?? targetKey,
            variants: spriteKey ? [spriteKey] : [],
            name: def.name ?? humanizeKey(targetKey),
            kind: "item",
            crafted: false,
            factors: {},
            frame: spriteInfo?.frame ?? { x: 0, y: 0, w: 16, h: 16 },
            sheetW: spriteInfo?.sheetW ?? 0,
            sheetH: spriteInfo?.sheetH ?? 0
          };
          itemMap.set(targetKey, entry);
          items.push(entry);
        } else {
          entry.name = def.name ?? entry.name;
          entry.kind = "item";
          if (spriteKey) {
            entry.spriteKey = spriteKey;
            entry.frame = spriteInfo.frame;
            entry.sheetW = spriteInfo.sheetW;
            entry.sheetH = spriteInfo.sheetH;
          }
        }

        entry.factors = { ...entry.factors, ...def };
      }

      // Blocks that are only the "lit" state of another block (e.g. Lit Furnace) are not separate entries.
      const litOf = new Map();
      for (const b of blocks) {
        if (b.lit_variant) litOf.set(stripNamespace(b.lit_variant), stripNamespace(b.id));
      }

      for (const blk of blocks) {
        const baseId = stripNamespace(blk.id);
        const groupedId = normalizeGroupKey(baseId);

        if (litOf.has(baseId)) {
          // Drop the stray "furnace_front_lit"-style entry if the atlas grouping created one,
          // and record the lit state on its parent block instead.
          const parent = itemMap.get(litOf.get(baseId));
          if (parent) {
            parent.lit = {
              name: blk.name,
              light: blk.light_emission,
              frontTile: blk.tiles?.front
            };
          }
          for (const k of [baseId, groupedId]) {
            const stray = itemMap.get(k);
            if (stray && stray !== parent) {
              const idx = items.indexOf(stray);
              if (idx !== -1) items.splice(idx, 1);
              itemMap.delete(k);
            }
          }
          continue;
        }

        const standaloneItemKey = `item_${baseId}`;
        if (!blk.no_item && itemMap.has(standaloneItemKey) && standaloneItemKey !== baseId) {
          const standalone = itemMap.get(standaloneItemKey);
          const idx = items.indexOf(standalone);
          if (idx !== -1) items.splice(idx, 1);
          itemMap.delete(standaloneItemKey);
        }

        let entry = itemMap.get(baseId) ?? itemMap.get(groupedId);

        const preferredSprite =
          blk.item_sprite && spriteMap.has(blk.item_sprite)
            ? blk.item_sprite
            : blk.tiles?.front && spriteMap.has(blk.tiles.front)
              ? blk.tiles.front
              : blk.tiles?.all && spriteMap.has(blk.tiles.all)
                ? blk.tiles.all
                : blk.tiles?.side && spriteMap.has(blk.tiles.side)
                  ? blk.tiles.side
                  : null;

        const spriteInfo = preferredSprite ? spriteMap.get(preferredSprite) : null;

        if (!entry) {
          entry = {
            key: baseId,
            spriteKey: preferredSprite ?? baseId,
            variants: preferredSprite ? [preferredSprite] : [],
            name: blk.name ?? humanizeKey(baseId),
            kind: "block",
            crafted: false,
            factors: {},
            frame: spriteInfo?.frame ?? { x: 0, y: 0, w: 16, h: 16 },
            sheetW: spriteInfo?.sheetW ?? 0,
            sheetH: spriteInfo?.sheetH ?? 0
          };
          itemMap.set(baseId, entry);
          items.push(entry);
        } else {
          if (entry.key !== baseId) {
            itemMap.delete(entry.key);
            entry.key = baseId;
            itemMap.set(baseId, entry);
          }
          entry.name = blk.name ?? entry.name;
          entry.kind = "block";
          if (spriteInfo) {
            entry.spriteKey = preferredSprite;
            entry.frame = spriteInfo.frame;
            entry.sheetW = spriteInfo.sheetW;
            entry.sheetH = spriteInfo.sheetH;
          }
        }

        entry.factors = { ...entry.factors, ...blk };

        if (blk.crop && blk.crop.tiles && blk.crop.stages > 0) {
          const stageTiles = [];
          for (let i = 0; i < blk.crop.stages; i++) {
            const t = `${blk.crop.tiles}${i}`;
            if (spriteMap.has(t)) stageTiles.push(t);
          }
          if (stageTiles.length > 0) {
            entry.cropTiles = stageTiles;
            entry.cropStage = stageTiles.length - 1;
            entry.variants = stageTiles;
          }
        }
      }
    }

    function getFactorItems(item) {
      const f = item.factors || {};
      const rows = [];

      if (f.max_stack !== undefined) {
        rows.push({ label: "Max Stack", value: String(f.max_stack) });
      }
      if (f.durability !== undefined) {
        rows.push({ label: "Durability", value: `${f.durability} uses` });
      }
      if (f.damage !== undefined) {
        rows.push({ label: "Damage", value: String(f.damage) });
      }
      if (f.weapon) {
        rows.push({ label: "Combat", value: "Melee Weapon" });
      }
      if (f.tool && typeof f.tool === "object") {
        rows.push({
          label: "Tool",
          value: `${humanizeKey(f.tool.kind)} · Tier ${f.tool.tier} · ${f.tool.speed}x speed`
        });
      }
      if (f.armor && typeof f.armor === "object") {
        rows.push({
          label: "Armor",
          value: `${humanizeKey(f.armor.slot)} · +${f.armor.points} points`
        });
      }
      if (f.food && typeof f.food === "object") {
        rows.push({
          label: "Food",
          value: `+${f.food.hunger} hunger · ${f.food.saturation} sat`
        });
      }
      if (f.fuel_ticks !== undefined) {
        rows.push({ label: "Fuel", value: `${f.fuel_ticks} ticks` });
      }
      if (item.lit) {
        rows.push({
          label: "Lit State",
          value: item.lit.light !== undefined
            ? `${item.lit.name ?? "Lit"} · light ${item.lit.light}`
            : (item.lit.name ?? "Lit")
        });
      }
      if (f.use) {
        rows.push({ label: "Use Action", value: humanizeKey(f.use) });
      }
      if (f.places) {
        rows.push({ label: "Places", value: humanizeKey(f.places) });
      }

      if (f.hardness !== undefined) {
        rows.push({
          label: "Hardness",
          value: f.hardness < 0 ? "Unbreakable" : String(f.hardness)
        });
      }
      if (typeof f.tool === "string") {
        const req = f.requires_tool ? " (Required)" : "";
        const tier = f.harvest_level !== undefined ? ` · Lv.${f.harvest_level}` : "";
        rows.push({ label: "Best Tool", value: `${humanizeKey(f.tool)}${tier}${req}` });
      } else if (f.harvest_level !== undefined) {
        rows.push({ label: "Harvest Level", value: `Lv.${f.harvest_level}` });
      }
      if (f.light_emission !== undefined && f.light_emission > 0) {
        rows.push({ label: "Light Emission", value: String(f.light_emission) });
      }
      if (f.light_opacity !== undefined) {
        rows.push({ label: "Light Opacity", value: String(f.light_opacity) });
      }
      if (f.interact) {
        rows.push({ label: "Interact", value: humanizeKey(f.interact) });
      }
      if (f.till_to) {
        rows.push({ label: "Tills Into", value: humanizeKey(f.till_to) });
      }
      if (f.double) {
        rows.push({ label: "Double Block", value: humanizeKey(f.double) });
      }
      if (Array.isArray(f.drops) && f.drops.length > 0) {
        const dropText = f.drops
          .map((d) => {
            const name = humanizeKey(d.item);
            const count = d.count && d.count > 1 ? ` ×${d.count}` : "";
            const chance = d.chance !== undefined ? ` (${Math.round(d.chance * 1000) / 10}%)` : "";
            return `${name}${count}${chance}`;
          })
          .join(", ");
        rows.push({ label: "Drops", value: dropText, wide: true });
      } else if (Array.isArray(f.drops) && f.drops.length === 0) {
        rows.push({ label: "Drops", value: "None", wide: true });
      }

      return rows;
    }

    function resolveToken(token, tags, itemMap, spriteMap) {
      if (!token || !String(token).trim()) return null;
      const trimmed = String(token).trim();

      if (trimmed.startsWith("#")) {
        const tagName = trimmed.slice(1);
        const members = tags[tagName] || [];
        const firstKey = members.length > 0 ? resolveItemKey(members[0], itemMap, spriteMap) : null;
        return {
          key: firstKey,
          label: humanizeKey(tagName),
          note: tagName === "planks"
        };
      }

      const key = resolveItemKey(trimmed, itemMap, spriteMap);
      const label = itemMap.get(key)?.name ?? humanizeKey(key);
      return { key, label, note: false };
    }

    function buildRecipeMap(recipesData, itemMap, spriteMap) {
      const map = {};
      const tags = recipesData?.tags ?? {};
      const craftingList = Array.isArray(recipesData?.recipes) ? recipesData.recipes : [];
      const smeltingList = Array.isArray(recipesData?.smelting) ? recipesData.smelting : [];

      for (const r of craftingList) {
        const outKey = resolveItemKey(r.result?.item, itemMap, spriteMap);
        if (!outKey) continue;

        const slots = Array.from({ length: 9 }, () => null);

        if (r.type === "shaped" && Array.isArray(r.grid)) {
          r.grid.forEach((rowStr, rowIdx) => {
            if (rowIdx >= 3) return;
            const chars = Array.isArray(rowStr) ? rowStr : String(rowStr).split("");
            chars.forEach((ch, colIdx) => {
              if (colIdx >= 3) return;
              const ingredientId = r.key?.[ch];
              if (!ingredientId) return;
              slots[rowIdx * 3 + colIdx] = resolveToken(ingredientId, tags, itemMap, spriteMap);
            });
          });
        } else if (Array.isArray(r.ingredients)) {
          let idx = 0;
          for (const ing of r.ingredients) {
            const count = ing.count ?? 1;
            const resolved = resolveToken(ing.item, tags, itemMap, spriteMap);
            for (let c = 0; c < count && idx < 9; c++, idx++) {
              slots[idx] = resolved ? { ...resolved } : null;
            }
          }
        }

        const outName = itemMap.get(outKey)?.name ?? humanizeKey(outKey);
        map[outKey] = {
          resultKey: outKey,
          resultCount: r.result?.count ?? 1,
          caption: r.type === "shapeless"
            ? `Shapeless recipe for ${outName}.`
            : `Crafted on a crafting grid (${r.id ?? outKey}).`,
          slots
        };
      }

      const furnaceKey = itemMap.has("furnace")
        ? "furnace"
        : spriteMap.has("furnace_front")
          ? "furnace_front"
          : null;
      const coalKey = itemMap.has("item_coal") ? "item_coal" : null;

      for (const s of smeltingList) {
        const outKey = resolveItemKey(s.output, itemMap, spriteMap);
        if (!outKey || map[outKey]) continue;

        const inKey = resolveItemKey(s.input, itemMap, spriteMap);
        const inName = itemMap.get(inKey)?.name ?? humanizeKey(inKey);
        const slots = Array.from({ length: 9 }, () => null);
        slots[1] = { key: inKey, label: inName, note: false };
        if (furnaceKey) slots[4] = { key: furnaceKey, label: "Furnace", note: false };
        if (coalKey) slots[7] = { key: coalKey, label: "Coal (Fuel)", note: false };

        map[outKey] = {
          resultKey: outKey,
          resultCount: 1,
          caption: `Smelted from ${inName} in a furnace${s.ticks ? ` (${s.ticks} ticks)` : ""}.`,
          slots
        };
      }

      // ---- Ember Alloy steps: Liquefaction, Infusion (hellforge), Quenching (water), Forging (anvil) ----
      const slotFor = (id, label) => {
        const key = resolveItemKey(id, itemMap, spriteMap);
        if (!key) return null;
        return { key, label: label ?? itemMap.get(key)?.name ?? humanizeKey(key), note: false };
      };
      const addStep = (outId, n, slots, caption, count = 1) => {
        const outKey = resolveItemKey(outId, itemMap, spriteMap);
        if (!outKey || map[outKey]) return;
        map[outKey] = {
          resultKey: outKey,
          resultCount: count,
          caption,
          slots,
          step: { n, name: STEP_NAMES[n] },
          station: n <= 2 ? "Hellforge" : n === 3 ? "Water" : "Anvil"
        };
      };
      const nameOf = (id) => {
        const k = resolveItemKey(id, itemMap, spriteMap);
        return itemMap.get(k)?.name ?? humanizeKey(k ?? stripNamespace(id));
      };
      const ticksTxt = (t) => (t ? ` (${t} ticks)` : "");

      for (const f of Array.isArray(recipesData?.forge) ? recipesData.forge : []) {
        const inputs = Array.isArray(f.inputs) ? f.inputs : [];
        if (inputs.length === 0) continue;
        const n = inputs.length === 1 ? 1 : 2;
        const slots = Array.from({ length: 9 }, () => null);
        inputs.slice(0, 3).forEach((id, i) => { slots[i] = slotFor(id); });
        slots[4] = slotFor("hellforge", "Hellforge");
        const list = inputs.map(nameOf).join(" + ");
        addStep(
          f.output, n, slots,
          n === 1
            ? `Step 1 of 4 \u00b7 Hellish Liquefaction: melt ${list} in a Hellforge${ticksTxt(f.ticks)}. The hellforge only burns below y=0.`
            : `Step 2 of 4 \u00b7 Infusion: add ${inputs.slice(1).map(nameOf).join(" + ")} to ${nameOf(inputs[0])} in a Hellforge${ticksTxt(f.ticks)}.`
        );
      }

      const quenchList = Array.isArray(recipesData?.quench) ? recipesData.quench : DEFAULT_QUENCH;
      for (const q of quenchList) {
        const slots = Array.from({ length: 9 }, () => null);
        slots[1] = slotFor(q.input);
        slots[4] = slotFor(q.medium ?? "water", "Water");
        addStep(
          q.output, 3, slots,
          `Step 3 of 4 \u00b7 Quenching: throw ${nameOf(q.input)} into water to chill it.`
        );
      }

      for (const a of Array.isArray(recipesData?.anvil) ? recipesData.anvil : []) {
        const slots = Array.from({ length: 9 }, () => null);
        slots[1] = slotFor(a.input);
        slots[4] = slotFor("anvil", "Anvil");
        if (a.tool) slots[7] = slotFor(a.tool, `${nameOf(a.tool)} (tool)`);
        addStep(
          a.output, 4, slots,
          `Step 4 of 4 \u00b7 Forging: strike ${nameOf(a.input)} with ${a.tool ? nameOf(a.tool) : "a hammer"} on an Anvil${a.damage ? ` (uses ${a.damage} durability)` : ""}.`,
          a.count ?? 1
        );
      }

      return map;
    }

    function craftFor(key) {
      return state.recipes[key] || null;
    }

    function createSprite(name, size) {
      const entry = state.spriteMap.get(name) ?? state.itemMap.get(name);
      if (!entry || !entry.sheetW || !entry.sheetH) {
        const fallback = document.createElement("span");
        fallback.className = "sprite-fallback";
        fallback.style.width = `${size}px`;
        fallback.style.height = `${size}px`;
        fallback.textContent = "?";
        return fallback;
      }

      const { x, y, w, h } = entry.frame;
      const scaleX = size / w;
      const scaleY = size / h;

      const span = document.createElement("span");
      span.className = "sprite";
      span.style.width = `${size}px`;
      span.style.height = `${size}px`;
      span.style.backgroundSize = `${entry.sheetW * scaleX}px ${entry.sheetH * scaleY}px`;
      span.style.backgroundPosition = `-${x * scaleX}px -${y * scaleY}px`;
      return span;
    }

    function getVisibleItems() {
      const q = state.query.trim().toLowerCase();
      return state.items.filter((item) => {
        if (state.filter === "block" && item.kind !== "block") return false;
        if (state.filter === "item" && item.kind !== "item") return false;
        if (state.filter === "crafted" && !item.crafted) return false;
        if (state.filter === "steps" && !state.recipes[item.key]?.step) return false;
        if (q) {
          const matchesName = item.name.toLowerCase().includes(q);
          const matchesKey = item.key.toLowerCase().includes(q);
          const matchesVariant = item.variants?.some((v) => v.toLowerCase().includes(q));
          if (!matchesName && !matchesKey && !matchesVariant) return false;
        }
        return true;
      });
    }

    function uniqueSlots(slots) {
      const seen = new Set();
      const out = [];
      for (const slot of slots) {
        if (!slot) continue;
        const label = slot.label ?? state.itemMap.get(slot.key)?.name ?? slot.key ?? "";
        const id = `${slot.key ?? ""}:${label}`;
        if (seen.has(id)) continue;
        seen.add(id);
        out.push({ ...slot, label });
      }
      return out;
    }

    function renderFilters() {
      filterBarEl.innerHTML = "";
      for (const [id, label] of FILTERS) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `filter-btn${state.filter === id ? " active" : ""}`;
        btn.textContent = label;
        btn.addEventListener("click", () => {
          state.filter = id;
          renderFilters();
          renderCatalog();
        });
        filterBarEl.appendChild(btn);
      }
    }

    function renderCatalog() {
      const visible = getVisibleItems();
      catalogPanelEl.innerHTML = "";

      if (visible.length === 0) {
        const p = document.createElement("p");
        p.className = "status-msg";
        p.textContent = "No tiles match.";
        catalogPanelEl.appendChild(p);
        return;
      }

      const ul = document.createElement("ul");
      ul.className = "tile-grid";

      for (const item of visible) {
        const li = document.createElement("li");
        const btn = document.createElement("button");
        const active = item.key === state.selected;

        btn.type = "button";
        btn.className = `item-btn${active ? " active" : ""}`;
        btn.setAttribute("aria-pressed", String(active));
        btn.title = item.variants?.length > 1
          ? `${item.name} (${item.variants.join(", ")})`
          : item.name;

        btn.appendChild(createSprite(item.spriteKey, 40));

        const sr = document.createElement("span");
        sr.className = "sr-only";
        sr.textContent = item.name;
        btn.appendChild(sr);

        btn.addEventListener("click", () => {
          state.selected = item.key;
          renderCatalog();
          renderRecipePanel();
        });

        li.appendChild(btn);
        ul.appendChild(li);
      }

      catalogPanelEl.appendChild(ul);
    }

    function renderRecipePanel() {
      const item = state.itemMap.get(state.selected) ?? null;
      const craft = item ? craftFor(item.key) : null;
      const slots = craft?.slots ?? Array.from({ length: 9 }, () => null);

      recipePanelEl.innerHTML = "";

      if (item) {
        const header = document.createElement("div");
        header.className = "recipe-header";

        const preview = document.createElement("span");
        preview.className = "preview-box";
        preview.appendChild(createSprite(item.spriteKey, 40));

        const info = document.createElement("div");
        const h2 = document.createElement("h2");
        h2.className = "recipe-title";
        h2.textContent = item.name;

        const meta = document.createElement("p");
        meta.className = "recipe-meta";
        meta.textContent = `${item.kind === "item" ? "Item" : "Block"}${
          craft?.step
            ? ` · Step ${craft.step.n}: ${craft.step.name}`
            : item.crafted || craft ? " · has recipe" : " · no recipe"
        }`;

        info.appendChild(h2);
        info.appendChild(meta);
        header.appendChild(preview);
        header.appendChild(info);
        recipePanelEl.appendChild(header);

        if (item.cropTiles && item.cropTiles.length > 1) {
          const maxStage = item.cropTiles.length - 1;
          const sec = document.createElement("div");
          sec.className = "crop-section";

          const lab = document.createElement("label");
          lab.className = "crop-label";
          lab.htmlFor = "crop-slider";
          const stageTxt = document.createElement("span");
          stageTxt.textContent = `Growth stage: ${item.cropStage} / ${maxStage}`;
          lab.appendChild(stageTxt);

          const slider = document.createElement("input");
          slider.type = "range";
          slider.id = "crop-slider";
          slider.className = "crop-slider";
          slider.min = "0";
          slider.max = String(maxStage);
          slider.step = "1";
          slider.value = String(item.cropStage);
          slider.addEventListener("input", () => {
            const v = Number(slider.value);
            item.cropStage = v;
            item.spriteKey = item.cropTiles[v];
            item.frame = state.spriteMap.get(item.spriteKey).frame;
            stageTxt.textContent = `Growth stage: ${v} / ${maxStage}`;
            preview.replaceChildren(createSprite(item.spriteKey, 40));
            renderCatalog();
          });

          sec.appendChild(lab);
          sec.appendChild(slider);
          recipePanelEl.appendChild(sec);
        } else if (item.variants && item.variants.length > 1) {
          const vRow = document.createElement("div");
          vRow.className = "variants-row";

          const vLabel = document.createElement("span");
          vLabel.className = "variants-label";
          vLabel.textContent = "Faces:";
          vRow.appendChild(vLabel);

          for (const vKey of item.variants) {
            const chip = document.createElement("span");
            chip.className = "variant-chip";
            chip.title = vKey;
            chip.appendChild(createSprite(vKey, 16));
            const txt = document.createElement("span");
            txt.textContent = vKey.replace(`${item.key}_`, "") || vKey;
            chip.appendChild(txt);
            vRow.appendChild(chip);
          }

          recipePanelEl.appendChild(vRow);
        }

        if (craft?.step) {
          const stepper = document.createElement("ol");
          stepper.className = "step-chain";
          stepper.setAttribute("aria-label", "Ember Alloy steps");
          for (const [num, name] of Object.entries(STEP_NAMES)) {
            const n = Number(num);
            const target = Object.values(state.recipes).find((r) => r.step?.n === n);
            const li = document.createElement("li");
            const b = document.createElement("button");
            b.type = "button";
            b.className = `step-chip${n === craft.step.n ? " active" : ""}`;
            b.textContent = `${n}. ${name}`;
            if (n === craft.step.n) b.setAttribute("aria-current", "step");
            if (target) {
              b.addEventListener("click", () => {
                state.selected = target.resultKey;
                renderCatalog();
                renderRecipePanel();
              });
            } else {
              b.disabled = true;
            }
            li.appendChild(b);
            stepper.appendChild(li);
          }
          recipePanelEl.appendChild(stepper);
        }

        const factorRows = getFactorItems(item);
        if (factorRows.length > 0) {
          const statsSec = document.createElement("div");
          statsSec.className = "stats-section";

          const heading = document.createElement("h3");
          heading.className = "stats-heading";
          heading.textContent = "Properties";
          statsSec.appendChild(heading);

          const statsUl = document.createElement("ul");
          statsUl.className = "stats-list";

          for (const row of factorRows) {
            const box = document.createElement("li");
            box.className = `stat-box${row.wide ? " wide" : ""}`;

            const lbl = document.createElement("span");
            lbl.className = "stat-label";
            lbl.textContent = row.label;

            const val = document.createElement("span");
            val.className = "stat-value";
            val.textContent = row.value;

            box.appendChild(lbl);
            box.appendChild(val);
            statsUl.appendChild(box);
          }

          statsSec.appendChild(statsUl);
          recipePanelEl.appendChild(statsSec);
        }
      } else {
        const header = document.createElement("div");

        const h2 = document.createElement("h2");
        h2.className = "recipe-title";
        h2.textContent = "Crafting";

        const hint = document.createElement("p");
        hint.className = "recipe-empty-hint";
        hint.textContent = "The table is empty until you pick a tile.";

        header.appendChild(h2);
        header.appendChild(hint);
        recipePanelEl.appendChild(header);
      }

      const row = document.createElement("div");
      row.className = "crafting-row";

      const grid = document.createElement("div");
      grid.className = "crafting-grid";
      grid.setAttribute("aria-label", craft?.step ? `${craft.station} (${craft.step.name})` : "Crafting table");

      for (const slot of slots) {
        const cell = document.createElement("div");
        cell.className = "craft-slot";

        if (slot?.key) {
          cell.appendChild(createSprite(slot.key, 36));
        }
        if (slot?.note) {
          const star = document.createElement("span");
          star.className = "slot-note";
          star.textContent = "*";
          cell.appendChild(star);
        }
        grid.appendChild(cell);
      }

      const arrow = document.createElement("div");
      arrow.className = "arrow";
      arrow.setAttribute("aria-hidden", "true");
      arrow.textContent = "→";

      const output = document.createElement("div");
      output.className = "output-slot";
      if (craft?.resultKey) {
        output.appendChild(createSprite(craft.resultKey, 40));
      }
      if (craft && craft.resultCount > 1) {
        const badge = document.createElement("span");
        badge.className = "result-count";
        badge.textContent = String(craft.resultCount);
        output.appendChild(badge);
      }

      row.appendChild(grid);
      row.appendChild(arrow);
      row.appendChild(output);
      recipePanelEl.appendChild(row);

      const caption = document.createElement("p");
      caption.className = "caption";
      if (item && craft) {
        caption.textContent = craft.caption ?? "Crafting recipe.";
      } else if (item) {
        caption.textContent = "This tile is not a crafting, furnace, or forge-step result.";
      } else {
        caption.textContent = "Output appears beside the table.";
      }
      recipePanelEl.appendChild(caption);

      if (craft) {
        const ul = document.createElement("ul");
        ul.className = "ingredients-list";

        for (const slot of uniqueSlots(slots)) {
          const li = document.createElement("li");
          li.className = "ingredient-item";

          if (slot.key) {
            li.appendChild(createSprite(slot.key, 20));
          }

          const text = document.createElement("span");
          text.textContent = slot.label;

          if (slot.note) {
            const note = document.createElement("span");
            note.className = "ingredient-note";
            note.textContent = " · any matching plank";
            text.appendChild(note);
          }

          li.appendChild(text);
          ul.appendChild(li);
        }

        recipePanelEl.appendChild(ul);
      }
    }

    function loadImageDimensions(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve({ width: img.naturalWidth, height: img.naturalHeight });
        img.onerror = () => reject(new Error(`Failed to load ${src}`));
        img.src = src;
      });
    }

    async function fetchJsonOptional(url) {
      try {
        const res = await fetch(url);
        if (!res.ok) return null;
        return await res.json();
      } catch {
        return null;
      }
    }

    async function init() {
      renderFilters();
      renderRecipePanel();

      searchInputEl.addEventListener("input", (e) => {
        state.query = e.target.value;
        renderCatalog();
      });

      try {
        const [atlasRes, recipesRes, blocksData, itemsData, imgDims] = await Promise.all([
          fetch("./atlas.json"),
          fetch("./recipes.json"),
          fetchJsonOptional("./blocks.json"),
          fetchJsonOptional("./items.json"),
          loadImageDimensions("./atlas.png")
        ]);

        if (!atlasRes.ok) throw new Error(`atlas.json HTTP ${atlasRes.status}`);
        if (!recipesRes.ok) throw new Error(`recipes.json HTTP ${recipesRes.status}`);

        const [atlasData, recipesData] = await Promise.all([
          atlasRes.json(),
          recipesRes.json()
        ]);

        const { items, spriteMap } = parseAtlas(atlasData, imgDims.width, imgDims.height);
        const itemMap = new Map(items.map((item) => [item.key, item]));

        mergeFactorsIntoItems(items, itemMap, spriteMap, blocksData, itemsData);

        const recipes = buildRecipeMap(recipesData, itemMap, spriteMap);

        for (const item of items) {
          if (recipes[item.key]) {
            item.crafted = true;
          }
        }

        state.items = items;
        state.itemMap = itemMap;
        state.spriteMap = spriteMap;
        state.recipes = recipes;

        tileCountEl.textContent = `${state.items.length} tiles. Click one to fill the crafting table.`;
        renderCatalog();
        renderRecipePanel();
      } catch (err) {
        console.error(err);
        tileCountEl.textContent = "Failed to load atlas data.";
        catalogPanelEl.innerHTML = `<p class="status-msg">Could not load <code>atlas.png</code>, <code>atlas.json</code>, or <code>recipes.json</code>.</p>`;
      }
    }

    init();
  </script>
</body>
</html>
